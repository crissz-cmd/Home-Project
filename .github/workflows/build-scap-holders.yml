name: Build Scap Holders Windows Product
on:
  workflow_dispatch:
  push:
    tags:
      - "scap-v*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build executable
        working-directory: Scap Holders
        env:
          SCAP_PUBLIC_KEY_B64: ${{ secrets.SCAP_PUBLIC_KEY_B64 }}
        run: .\build_product.bat
      - name: Upload product artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScapHolders-Windows
          path: Scap Holders/dist/ScapHolders
